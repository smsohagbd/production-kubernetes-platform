backend:
  image:
    repository: smsohag/backend
    pullPolicy: IfNotPresent

  port: 5000
  
  config:
    appEnv: Production
    dbHost: mysql
    dbPort: "3306"



  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

  ingress:
    enabled: true
    className: nginx
    path: /
    pathType: Prefix


frontend:
  image:
    repository: smsohag/frontend
    pullPolicy: IfNotPresent

  port: 80

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    className: nginx
    path: /
    pathType: Prefix