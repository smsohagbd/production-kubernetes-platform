apiVersion: v1
kind: Service
metadata:
  name : backend
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: backend
  ports:
    - name : backend
      port: {{ .Values.backend.service.port}}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP