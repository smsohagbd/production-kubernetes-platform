on:
    push:
        paths:
        - "frontend/**"
jobs:
    frontend-ci:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: setup nodejs
              uses: actions/setup-node@v5
              with:
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

            - name : Install Dependencis
              working-directory: frontend
              run: npm ci
            
            - name: build frontend
              working-directory: frontend
              run: npm run build


            
            
