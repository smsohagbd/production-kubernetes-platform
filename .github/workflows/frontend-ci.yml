on:
    push:
        paths:
        - "frontend/**"
jobs:
    frontend-ci:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: setup nodejs
              uses: actions/setup-node@v5
              with:
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

            - name : Install Dependencis
              working-directory: frontend
              run: npm ci
            
            - name: build frontend
              working-directory: frontend
              run: npm run build

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Set image tag
              run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/frontend:${{ env.IMAGE_TAG }}
                build-args: |
                  VITE_API_URL=https://api.sohag.com.bd
                cache-from: type=gha
                cache-to: type=gha,mode=max

            ##### CD k8s
            - name: Set up kubectl
              uses: azure/setup-kubectl@v4
              with:
                version: 'v1.34.10'

            - name: Configure kubectl
              run: |
                mkdir -p "$HOME/.kube"
                echo "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
                chmod 600 "$HOME/.kube/config"

            - name: Test Kubernetes access
              run: kubectl get deployment frontend -n production

            - name: Deploy frontend
              run: |
                kubectl set image deployment/frontend \
                  frontend=${{ vars.DOCKERHUB_USERNAME }}/frontend:${{ env.IMAGE_TAG }} \
                  -n production

            - name: Wait for rollout
              run: |
                kubectl rollout status deployment/frontend \
                  -n production \
                  --timeout=180s
                        
