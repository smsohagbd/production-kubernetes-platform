on:
    push:
        paths:
        - "frontend/**"
permissions:
      contents: write
      
jobs:
    frontend-ci:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: setup nodejs
              uses: actions/setup-node@v5
              with:
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

            - name : Install Dependencis
              working-directory: frontend
              run: npm ci
            

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Set image tag
              run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/frontend:${{ env.IMAGE_TAG }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
            
            - name: install yq
              uses: mikefarah/yq@v4

            - name: update image tag to yaml file
              env:
                IMAGE_TAG: ${{ env.IMAGE_TAG}}
              run: |
                yq -i '.frontend.image.tag = strenv(IMAGE_TAG)' \
                  helm/platform/values-staging.yaml
            - name: verify image tag
              run: |
                yq '.frontend.image.tag' helm/platform/values-staging.yaml
                
            - name: Commit staging image update
              run: |
                git config user.name "github-action[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                git add helm/platform/values-staging.yaml
                git commit -m "ci: update staging frontend image to ${IMAGE_TAG}"
                git push
