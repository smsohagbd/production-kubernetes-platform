name: Backend CI

on:
  push:
    paths:
    - 'backend/**'

permissions:
  contents: write


jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'

        - name: Install uv
          uses: astral-sh/setup-uv@v9.0.0

        - name: Install dependencies
          working-directory: backend
          run: uv sync --locked

        - name: run py test
          working-directory: backend
          run: uv run pytest

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Set image tag
          run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

        - name: build docker image
          uses: docker/build-push-action@v7
          with:
            context: ./backend
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/backend:${{ env.IMAGE_TAG }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

        - name: Install yq
          uses: mikefarah/yq@v4

        - name: update image tag to yaml file
          env:
            IMAGE_TAG: ${{ env.IMAGE_TAG}}
          run: |
            yq -i '.backend.image.tag = strenv(IMAGE_TAG)' \
              helm/platform/values-staging.yaml
        - name: verify image tag
          run: |
            yq '.backend.image.tag' helm/platform/values-staging.yaml
            
        - name: Commit staging image update
          run: |
            git config user.name "github-action[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add helm/platform/values-staging.yaml
            git commit -m "ci: update staging backend image to ${IMAGE_TAG}"
            git push

            
        