on:
  push:
    paths:
    - 'backend/**'

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'

        - name: Install uv
          uses: astral-sh/setup-uv@v9.0.0

        - name: Install dependencies
          working-directory: backend
          run: uv sync --locked

        - name: run py test
          working-directory: backend
          run: uv run pytest