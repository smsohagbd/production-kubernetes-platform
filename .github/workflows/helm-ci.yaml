name: Staging CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'helm/platform/**'
      - '.github/workflows/helm-ci.yaml'

jobs:
  validate-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint helm/platform

      - name: Helm template staging
        run: |
          helm template staging helm/platform \
            --namespace staging \
            --values helm/platform/values-staging.yaml \
            > /tmp/staging-rendered.yaml

      - name: Helm template production
        run: |
          helm template production helm/platform \
            --namespace production \
            --values helm/platform/values-production.yaml \
            > /tmp/production-rendered.yaml