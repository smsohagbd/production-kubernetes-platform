apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-cd
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-cd
  namespace: production
rules:
  - apiGroups:
      - apps
    resources:
      - deployment
    resourceName:
      - backend
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-cd
  namespace: production
subject:
  - kind : ServiceAccount
    name: backend-cd
    namespace: production
roleRef:
  kind: Role
  name: backend-cd
  apiGroup: rbac.authorization.k8s.io